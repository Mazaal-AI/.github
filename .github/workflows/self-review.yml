# Dogfoods the shared reviewer on the repository that holds it, so the
# end-to-end path (reusable workflow -> pinned script checkout -> review
# comment) is exercised by this repository own pull requests.
name: AI PR Review

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ai-pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    uses: Mazaal-AI/.github/.github/workflows/ai-pr-review.yml@main
    secrets: inherit
