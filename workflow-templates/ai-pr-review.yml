# Starter workflow shown in every repository in the organisation under
# Actions > New workflow. Copy it in, or add it by hand — it is the whole
# adoption cost of the shared AI reviewer.
name: AI PR Review

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ai-pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    uses: Mazaal-AI/.github/.github/workflows/ai-pr-review.yml@main
    secrets: inherit
